
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speech Synthesis Application</title>
</head>
<body>
    <h2>Text to Speech</h2>

    <textarea id="text" rows="5" cols="40" placeholder="Enter text to speak"></textarea>
    <br><br>

    <label for="voiceSelect">Choose Voice:</label>
    <select id="voiceSelect"></select>
    <p id="voiceMessage"></p>

    <br>

    <label for="rate">Rate:</label>
    <input type="range" id="rate" min="0.5" max="2" step="0.1" value="1">
    <span id="rateValue">1</span>

    <br><br>

    <label for="pitch">Pitch:</label>
    <input type="range" id="pitch" min="0" max="2" step="0.1" value="1">
    <span id="pitchValue">1</span>

    <br><br>

    <button id="speak">Speak</button>
    <button id="stop">Stop</button>

    <script>
        const synth = window.speechSynthesis;
        const textInput = document.getElementById("text");
        const voiceSelect = document.getElementById("voiceSelect");
        const rateInput = document.getElementById("rate");
        const pitchInput = document.getElementById("pitch");
        const rateValue = document.getElementById("rateValue");
        const pitchValue = document.getElementById("pitchValue");
        const voiceMessage = document.getElementById("voiceMessage");

        let voices = [];

        function loadVoices() {
            voices = synth.getVoices();
            voiceSelect.innerHTML = "";

            if (voices.length === 0) {
                voiceMessage.textContent = "No voices available yet.";
                return;
            }

            voiceMessage.textContent = "";

            voices.forEach((voice, index) => {
                const option = document.createElement("option");
                option.value = index;
                option.textContent =
                    voice.name + " (" + voice.lang + ")";
                voiceSelect.appendChild(option);
            });
        }

        loadVoices();
        synth.addEventListener("voiceschanged", loadVoices);

        function speak() {
            const text = textInput.value.trim();

            if (!text) {
                alert("Please enter some text.");
                return;
            }

            if (voices.length === 0) {
                alert("No voices are available.");
                return;
            }

            synth.cancel();

            const utterance = new SpeechSynthesisUtterance(text);

            utterance.voice = voices[Number(voiceSelect.value)];
            utterance.rate = Number(rateInput.value);
            utterance.pitch = Number(pitchInput.value);

            synth.speak(utterance);
        }

        document.getElementById("speak").addEventListener("click", speak);

        document.getElementById("stop").addEventListener("click", function () {
            synth.cancel();
        });

        rateInput.addEventListener("input", function () {
            rateValue.textContent = rateInput.value;
        });

        pitchInput.addEventListener("input", function () {
            pitchValue.textContent = pitchInput.value;
        });

        voiceSelect.addEventListener("change", function () {
            if (synth.speaking) {
                speak();
            }
        });
    </script>
</body>
</html>
